name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The action polls Pages for deployment_in_progress and aborts at its
          # default 600000 ms. On 2026-08-06 Pages slowed enough that a deploy
          # taking 8m09s succeeded and the next two hit the ceiling and failed,
          # with a clean build and a healthy artifact both times. 30 minutes
          # gives the platform room without leaving a job hanging all day.
          timeout: 1800000
